services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:?required}"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        node dist/scripts/migrate.js || exit 1
        node dist/scripts/create-superadmin.js || echo "[warn] superadmin bootstrap skipped/failed (continuing)"
        exec node dist/server.js
    environment:
      NODE_ENV: ${NODE_ENV:?required}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?required}
      DIRECT_URL: ${DIRECT_URL:-}
      ALLOW_REMOTE_DB_IN_DEV: ${ALLOW_REMOTE_DB_IN_DEV:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      MAIL_MODE: ${MAIL_MODE:?required}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:?required}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-MiDukandar}
      SMS_MODE: ${SMS_MODE:-log}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      SMS_DLT_TEMPLATE_ID: ${SMS_DLT_TEMPLATE_ID:-}
      SMS_DLT_ENTITY_ID: ${SMS_DLT_ENTITY_ID:-}
      SMS_DAILY_FREE_LIMIT: ${SMS_DAILY_FREE_LIMIT:-100}
      SMS_TIMEOUT_MS: ${SMS_TIMEOUT_MS:-5000}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-1}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_MASTER: ${OTP_MASTER:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_URL: ${APP_URL:?required}
      APP_NAME: ${APP_NAME:-MiDukandar}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?required}
      SUPERADMIN_JWT_SECRET: ${SUPERADMIN_JWT_SECRET:?required}
      SUPERADMIN_ACCESS_EXPIRES_IN: ${SUPERADMIN_ACCESS_EXPIRES_IN:-15m}
      SUPERADMIN_IMPERSONATION_MINUTES: ${SUPERADMIN_IMPERSONATION_MINUTES:-30}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?required}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:?required}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?required}
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
      # Read by web/next.config.ts: an https:// origin turns on HSTS and
      # `upgrade-insecure-requests`. Keep this in sync with the backend's
      # APP_URL above so the two agree on the public origin.
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  uploads: