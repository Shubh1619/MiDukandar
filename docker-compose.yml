services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1619}
      POSTGRES_DB: mazedukan
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mazedukan"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    # Run migrations before the API and ABORT if they fail. The previous form
    # (`... 2>/dev/null || true`) discarded every migration error and ignored the
    # exit code, so a failed or half-applied migration still started the server
    # against a wrong schema — surfacing later as "relation does not exist" on
    # live endpoints. This mirrors the fail-fast logic in docker-entrypoint.sh.
    # Superadmin bootstrap stays non-fatal (an existing account must not block a
    # restart) but is no longer silent.
    command:
      - sh
      - -c
      - |
        node dist/scripts/migrate.js || exit 1
        node dist/scripts/create-superadmin.js || echo "[warn] superadmin bootstrap skipped/failed (continuing)"
        exec node dist/server.js
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-1619}@db:5432/mazedukan}
      DIRECT_URL: ${DIRECT_URL:-}
      # Allow a development NODE_ENV to point at a non-local DB (config.ts
      # otherwise refuses to boot). Leave unset for the normal local stack.
      ALLOW_REMOTE_DB_IN_DEV: ${ALLOW_REMOTE_DB_IN_DEV:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-min-32-characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-min-32-characters}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      # `log` prints emails (incl. OTPs) to the console; `brevo` sends via the
      # Brevo HTTP API. Render/production must set MAIL_MODE=brevo.
      MAIL_MODE: ${MAIL_MODE:-log}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@midukandar.com}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-MiDukandar}
      OTP_EXPIRY_MINUTES: 1
      OTP_LENGTH: 6
      # OTP_MASTER is a universal OTP override: anyone who knows it can log in as
      # any account without receiving a code. It is refused outright in
      # production (see assertProductionSecrets in backend/src/config.ts), so it
      # must NOT have a default here — the previous `${OTP_MASTER:-000000}` meant
      # that even a deployment that never configured one shipped a working
      # bypass, and boot failed only because of that injected value. Forward the
      # variable with no default so it stays absent unless explicitly set.
      OTP_MASTER: ${OTP_MASTER:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Uploaded files are stored on local disk (backend/uploads) and served at
      # /api/uploads/files/*. Persisted via the `uploads` volume below so they
      # survive container rebuilds/restarts.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Public origin. Used to derive the refresh-cookie Secure flag, and by
      # web/next.config.ts to decide whether Strict-Transport-Security and the
      # CSP `upgrade-insecure-requests` directive are safe to send. Point this at
      # your real https origin in production; the http:// default is correct only
      # for local use and for TLS terminated in front of this container.
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_NAME: MiDukandar
      # Comma-separated list of allowed browser origins. In non-production the
      # API additionally allows any http://localhost:<port> origin.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SUPERADMIN_JWT_SECRET: ${SUPERADMIN_JWT_SECRET:-dev-superadmin-secret-change-me-min-32-characters}
      SUPERADMIN_ACCESS_EXPIRES_IN: 15m
      SUPERADMIN_IMPERSONATION_MINUTES: 30
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
      # Read by web/next.config.ts: an https:// origin turns on HSTS and
      # `upgrade-insecure-requests`. Keep this in sync with the backend's
      # APP_URL above so the two agree on the public origin.
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  uploads: